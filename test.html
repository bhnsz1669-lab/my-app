<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود برنامه</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px; 
            width: 100%;
            padding: 25px;
            text-align: center;
        }
        .download-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            width: 80%;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 
        ⚠️ دقت کن: 
        1. اول فایل APK خودت رو در گیت‌هاب آپلود کن.
        2. بعد، اسم دقیق فایل APK رو در عبارت "dost.apk" بنویس.
        مثال: اگر اسم فایلت download.apk هست، بنویس: src="download.apk"
     -->
    <a href="dost.apk" class="download-btn">📥 دانلود و نصب مستقیم برنامه</a>
</div>

</body>
</html>
