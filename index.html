<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوستیابی و چت | دانلود برنامه</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #12181f; color: #ffffff; direction: rtl; line-height: 1.6; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1a2332; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.3); max-width: 430px; width: 100%; padding: 16px; position: relative; overflow: hidden; }
        
        .download-btn { width: 100%; padding: 14px; background-color: #12181f; border: 2px solid #0b57d0; color: #ffffff; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s; margin-bottom: 14px; outline: none; }
        .progress-bar { position: absolute; top: 0; right: 0; height: 100%; background-color: #0b57d0; width: 0%; transition: width 0.1s linear; z-index: 0; }
        #btnText { position: relative; z-index: 1; pointer-events: none; }
        .paused { border-color: #ffd54f !important; }
        .paused .progress-bar { background-color: #ffd54f !important; }
        .finished { border-color: #00e676 !important; cursor: default !important; }
        .finished .progress-bar { background-color: #00e676 !important; }

        .app-info { display: flex; align-items: center; gap: 15px; margin-bottom: 14px; }
        .app-icon { width: 70px; height: 70px; border-radius: 16px; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }
        .app-title h2 { font-size: 18px; margin-bottom: 2px; }
        .app-title p { color: #8899a6; font-size: 13px; }
        
        .antivirus-section { background-color: #12181f; border-radius: 12px; padding: 12px; margin-bottom: 14px; border: 1px solid #2a394a; }
        .av-toggle-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: none; color: #ffffff; font-size: 13px; font-weight: bold; cursor: pointer; }
        .arrow { transition: transform 0.3s; color: #8899a6; }
        .av-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .av-content.show { max-height: 500px; }
        .av-list { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
        .av-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .status-clean { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-info">
        <div class="app-icon"><img src="logo.png" alt="آیکون"></div>
        <div class="app-title"><h2>دوستیابی و چت آنلاین</h2><p>نسخه اندروید (.apk)</p></div>
    </div>

    <button class="download-btn" id="downloadBtn" onclick="toggleDownload()">
        <div class="progress-bar" id="progressBar"></div>
        <span id="btnText">📥 نصب برنامه</span>
    </button>

    <div class="antivirus-section">
        <button class="av-toggle-btn" id="avToggleBtn">
            <span>🛡️ مشاهده‌ی نتایج بررسی آنتی‌ویروس</span>
            <span class="arrow" id="avArrow">▼</span>
        </button>
        <div class="av-content" id="avContent">
            <div class="av-list" id="avListContainer"></div>
        </div>
    </div>
</div>

<script>
    let progress = 0;
    let isDownloading = false;
    let isFinished = false;
    let interval = null;

    function toggleDownload() {
        if (isFinished) return; 

        const btn = document.getElementById('downloadBtn');
        const text = document.getElementById('btnText');
        const bar = document.getElementById('progressBar');

        if (isDownloading) {
            clearInterval(interval);
            isDownloading = false;
            btn.classList.add('paused');
            text.innerText = "ادامه دانلود (" + Math.floor(progress) + "%)";
        } else {
            isDownloading = true;
            btn.classList.remove('paused');
            interval = setInterval(() => {
                progress += 0.8;
                bar.style.width = progress + "%";
                text.innerText = "در حال دانلود (" + Math.floor(progress) + "%)";
                
                if (progress >= 100) {
                    clearInterval(interval);
                    isFinished = true;
                    isDownloading = false;
                    text.innerText = "نصب شد ✅";
                    btn.classList.add('finished');
                    btn.style.cursor = "default";
                    // می‌توانید اینجا دستور دانلود فایل را اضافه کنید: window.location.href = 'dost.apk';
                }
            }, 100);
        }
    }

    // منطق آنتی ویروس
    const antivirusList = ["McAfee", "FSecure", "Symantec", "ClamAv", "Kaspersky", "Eset", "DrWeb", "Comodo", "ZonerMobileSecurity", "GooglePlayProtect"];
    const avListContainer = document.getElementById('avListContainer');
    antivirusList.forEach((name, index) => {
        avListContainer.innerHTML += `<div class="av-item"><span class="av-name">${name}</span><span class="av-status status-clean">🟢 سالم</span></div>`;
    });

    document.getElementById('avToggleBtn').addEventListener('click', () => {
        const content = document.getElementById('avContent');
        const arrow = document.getElementById('avArrow');
        content.classList.toggle('show');
        arrow.style.transform = content.classList.contains('show') ? "rotate(180deg)" : "rotate(0deg)";
    });
</script>

</body>
</html>
