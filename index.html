<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود و نصب برنامه</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background: #0b0f14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #161c24; border-radius: 30px; padding: 35px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #2d3748; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        
        .app-icon { width: 90px; height: 90px; background: #1a2332; border-radius: 22px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }

        /* دکمه با انیمیشن تپنده */
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .download-btn { width: 100%; padding: 18px; background: #0b57d0; color: #fff; border: none; border-radius: 18px; font-size: 18px; font-weight: bold; cursor: pointer; position: relative; overflow: hidden; animation: pulse 2s infinite; transition: 0.3s; }
        .progress-bar { position: absolute; top: 0; right: 0; height: 100%; background: #073a8c; width: 0%; transition: width 0.1s linear; }
        #btnText { position: relative; z-index: 1; pointer-events: none; }

        .trust-badge { margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 8px; border-radius: 10px; }
        .features { display: flex; justify-content: space-around; margin: 25px 0; }
        .feat { font-size: 12px; color: #94a3b8; display: flex; flex-direction: column; gap: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-icon">🚀</div>
    <h1 style="font-size: 22px; margin-bottom: 10px;">نصب اپلیکیشن چت</h1>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">نسخه جدید و ایمن اندروید</p>

    <button class="download-btn" id="downloadBtn" onclick="toggleDownload()">
        <div class="progress-bar" id="progressBar"></div>
        <span id="btnText">📥 نصب مستقیم (۱۱ مگابایت)</span>
    </button>

    <div class="trust-badge">
        <span>🛡️</span> تایید شده توسط سیستم امنیتی
    </div>

    <div class="features">
        <div class="feat"><span>⚡</span> پرسرعت</div>
        <div class="feat"><span>🔒</span> امن</div>
        <div class="feat"><span>⭐</span> رایگان</div>
    </div>
</div>

<script>
    let progress = 0, isDownloading = false;
    function toggleDownload() {
        if (progress >= 100) return;
        const btn = document.getElementById('downloadBtn'), text = document.getElementById('btnText'), bar = document.getElementById('progressBar');
        
        if (!isDownloading) {
            isDownloading = true;
            btn.style.animation = "none";
            let interval = setInterval(() => {
                progress += 1.2;
                bar.style.width = progress + "%";
                text.innerText = "در حال دانلود (" + Math.floor(progress) + "%)";
                if (progress >= 100) {
                    clearInterval(interval);
                    text.innerText = "نصب کامل شد ✅";
                    btn.style.background = "#059669";
                }
            }, 80);
        }
    }
</script>

</body>
</html>
