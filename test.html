<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راهنمای نصب و دانلود برنامه</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px; 
            width: 100%;
            padding: 25px;
            text-align: center;
        }
        h2 { color: #333; font-size: 20px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .video-box {
            position: relative;
            padding-bottom: 177.7%; /* نسبت 9:16 برای ویدیوهای عمودی موبایل */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
            margin-bottom: 25px;
        }
        .video-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
        .download-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            width: 80%;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>فیلم آموزشی را ببینید و برنامه را نصب کنید</h2>
    <p>لطفاً ابتدا ویدیوی آموزشی زیر را تا انتها تماشا کنید، سپس اقدام به دانلود و نصب برنامه نمایید.</p>
    
    <div class="video-box">
        <video controls playsinline>
            <!-- 
                 ⚠️ دقت کن: اگر اسم ویدیوی خودت در گیت‌هاب چیز دیگری است، 
                 جای عبارت video.mp4، دقیقاً همان نام را بنویس 
            -->
            <source src="video.mp4" type="video/mp4">
            مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
        </video>
    </div>

    <!-- 
        ⚠️ دقت کن: 
        1. اول فایل APK خودت رو در گیت‌هاب آپلود کن.
        2. بعد، اسم دقیق فایل APK رو در عبارت "apk_file_name.apk" بنویس.
        مثال: اگر اسم فایلت download.apk هست، بنویس: src="download.apk"
     -->
    <a href="apk_file_name.apk" class="download-btn">📥 دانلود و نصب مستقیم برنامه</a>
</div>

</body>
</html>
